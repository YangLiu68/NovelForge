[project]
name = "novelforge"
version = "0.1.0"
description = "Evidence-grounded long-form fiction workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pgvector>=0.4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local PostgreSQL 16 + pgvector without Docker (dev machines only; CI uses a service container).
localdb = ["pgserver>=0.1.4"]
# Local ONNX embedding model and cross-encoder reranker (CPU, no GPU needed).
embeddings = ["fastembed==0.8.1", "onnxruntime==1.30.0"]
# Claude via the official Anthropic SDK (LLM_PROVIDER=anthropic).
anthropic = ["anthropic==1.11.0"]

[project.scripts]
novelforge = "novelforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novelforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not a package

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated migrations
# Chinese regex tables and test sentences: each CJK character counts as two columns.
"novelforge/core/extraction_zh.py" = ["E501"]
"tests/test_extraction_zh.py" = ["E501"]
