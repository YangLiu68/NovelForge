server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # Client-side routes fall back to the SPA entry point.
    location / {
        try_files $uri /index.html;
    }
}
