slug: wuling-chashi
title: 雾岭茶事
language: zh
synopsis: >-
  八十二岁的茶山主人苏怀山在清明前把家人叫上雾岭：管公司的孙女苏晚棠、想把山卖给度假村的孙子苏明澈、
  头一回回国的混血外孙女叶芙、苏家的律师何景行，还有替他守了二十年茶山的布朗族汉子岩温。
  老人当众念完遗嘱的那天夜里离世，一场雨季塌方和一年的春茶，把这几个人重新拴在了同一座山上。
characters:
