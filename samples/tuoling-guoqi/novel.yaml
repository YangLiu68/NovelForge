slug: tuoling-guoqi
title: 驼铃过碛
language: zh
synopsis: >-
  粟特萨宝康拂延死在西州，女儿康米娜接过驼队的铜印，带着老驼头卫长庚、捡来的驼童石小满、
  于阗译语人尉迟兰、都督府书记裴照和老郎中安鹤年，从沙州出发，横穿八百里莫贺延碛去高昌。
  一场黑风过后，驼队少了一个人；一年以后，他们又一次从沙州出发。
