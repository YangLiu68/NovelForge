title: 太液秋深
language: zh
synopsis: >-
  景和十二年秋，龟兹公主白昙和亲入宫，封昭仪，住进临着太液池的承香殿。不识字的浣衣宫女许青禾
  被老宫人孙嬷嬷挑去伺候，又一同照看生母早逝的七皇子李昀。三天后，七皇子在太液池落水，孙嬷嬷
  死在掖庭的废井里，留下一张缝在旧袄里的纸，牵出五年前一桩坠马旧案和权倾六宫的郑贵妃。
