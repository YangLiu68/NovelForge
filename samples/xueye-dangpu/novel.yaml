slug: xueye-dangpu
title: 雪夜当铺
language: zh
synopsis: >-
  沈知微重生回到十七岁，离家产被夺、自己冻死在当铺门外还有二十七天。她要在二叔卖掉老宅之前，
  把这笔账一笔一笔算回来。
characters:
