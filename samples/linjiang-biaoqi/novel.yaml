slug: linjiang-biaoqi
title: 临江镖旗
language: zh
synopsis: >-
  临江城的长风镖局日渐败落。中秋前夜，一个来历不明的姑娘冒雨托镖，要把一只匣子送到云州渡口。
  镖队翻过韩七盘踞的黑松岭，赔上了一条人命；两年后，托镖的姑娘带着伤回来，
  长风镖局要把那笔没算完的账算清。
characters:
