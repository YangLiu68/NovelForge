name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://novelforge:novelforge@localhost:5432/novelforge

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: novelforge
          POSTGRES_PASSWORD: novelforge
          POSTGRES_DB: novelforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novelforge" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run ruff format --check .
      - name: Sample evaluation (in-memory and through the database)
        run: |
          uv run novelforge migrate
          uv run novelforge eval-sample
          uv run novelforge eval-sample --db
      - name: Retrieval benchmark smoke test (mock embedder, small generated corpus)
        run: |
          uv run novelforge gen-corpus --chapters 30 --seed 1 --out /tmp/syn30
          uv run novelforge bench-retrieval /tmp/syn30 --embedder hash --reranker lexical --out /tmp/bench

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: novelforge
          POSTGRES_PASSWORD: novelforge
          POSTGRES_DB: novelforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novelforge" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
